<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nurses Notes Quiz</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
h1 { color: #c62828; text-align: center; }
input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
}
.question {
  margin: 22px 0;
  padding: 12px;
  background: #f8f8f8;
  border-radius: 8px;
}
label { display: block; padding: 7px; }
button {
  width: 100%;
  padding: 14px;
  background: #c62828;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 16px;
}
#result { margin-top: 20px; text-align: center; }
</style>
</head>

<body>
<div class="container">

<h1>Nurses Notes</h1>
<h3>GNM Nursing Practice Quiz</h3>

<input id="studentName" placeholder="Enter Student Name" required>
<input id="rollNumber" placeholder="Enter Roll Number">

<form id="quizForm">

<div id="questions"></div>

<button type="submit" id="submitBtn">
Submit Quiz
</button>
</form>

<div id="result"></div>
</div>

<script>

// Paste your deployed Apps Script URL here
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyF_kGaAdxqk4tPBNlxfka_fhcJMCRLgopyUsqihS4bFuSBUPwC_7qqmjcK3hIbJ1JKww/exec";

const quizQuestions = [
{
q: "What is the normal adult pulse rate per minute?",
o: ["40–50", "60–100", "110–130", "130–150"],
a: 1
},
{
q: "Which instrument is used to measure blood pressure?",
o: ["Thermometer", "Stethoscope only", "Sphygmomanometer", "Glucometer"],
a: 2
},
{
q: "What is the normal body temperature in Celsius approximately?",
o: ["30°C", "37°C", "40°C", "42°C"],
a: 1
},
{
q: "Which vitamin helps in blood clotting?",
o: ["Vitamin A", "Vitamin B12", "Vitamin C", "Vitamin K"],
a: 3
},
{
q: "What is the normal adult respiratory rate per minute?",
o: ["12–20", "25–35", "5–10", "30–40"],
a: 0
}
];

const questionBox = document.getElementById("questions");

quizQuestions.forEach((item, i) => {
  let html = `<div class="question">
  <b>Q${i+1}. ${item.q}</b>`;

  item.o.forEach((option, j) => {
    html += `
    <label>
    <input type="radio" name="q${i}" value="${j}" required>
    ${option}
    </label>`;
  });

  html += `</div>`;
  questionBox.innerHTML += html;
});

document.getElementById("quizForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const name = document.getElementById("studentName").value.trim();
  const roll = document.getElementById("rollNumber").value.trim();
  const result = document.getElementById("result");
  const btn = document.getElementById("submitBtn");

  if (!name) {
    alert("Please enter your name");
    return;
  }

  let score = 0;

  quizQuestions.forEach((item, i) => {
    const selected = document.querySelector(
      `input[name="q${i}"]:checked`
    );

    if (selected && Number(selected.value) === item.a) {
      score++;
    }
  });

  const total = quizQuestions.length;
  const percentage = Math.round(score / total * 100);

  const data = {
    name: name,
    roll: roll,
    quiz: "GNM Nursing Practice Quiz",
    score: score,
    total: total
  };

  btn.disabled = true;
  btn.innerText = "Submitting...";

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    result.innerHTML = `
      <h2>Quiz Completed!</h2>
      <h3>Your Score: ${score}/${total}</h3>
      <h3>Percentage: ${percentage}%</h3>
      <p>Your result submission has been sent.
      Please check with your teacher for confirmation.</p>
    `;

    document.querySelectorAll("input").forEach(input => {
      input.disabled = true;
    });

  } catch (error) {
    result.innerHTML =
      "<p>Submission could not be sent. Please try again.</p>";

    btn.disabled = false;
    btn.innerText = "Submit Quiz";
  }
});
</script>

</body>
</html>
